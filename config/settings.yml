plugins:
  smtp_router_optimizer_enabled:
    default: false
    client: false
  smtp_router_optimizer_mode:
    default: "shadow"
    type: enum
    choices:
      - shadow
      - active
    client: false
  smtp_router_optimizer_prior_strength:
    default: 300
    min: 1
    max: 100000
    client: false
  smtp_router_optimizer_history_days:
    default: 14
    min: 3
    max: 90
    client: false
  smtp_router_optimizer_half_life_days:
    default: 7
    min: 1
    max: 90
    client: false
  smtp_router_optimizer_domain_groups:
    type: list
    list_type: simple
    default: "microsoft=hotmail.com,outlook.com,live.com,msn.com,hotmail.co.uk,hotmail.ca,live.ca,live.co.uk,outlook.co.uk,hotmail.fr,live.com.au,windowslive.com,passport.com,webtv.net|apple=icloud.com,me.com,mac.com|spectrum=charter.net,*.rr.com,roadrunner.com,twc.com,brighthouse.com|comcast=comcast.net|yahoo=yahoo.com,ymail.com,rocketmail.com,aol.com,aim.com,verizon.net,att.net,sbcglobal.net,bellsouth.net,pacbell.net,swbell.net,ameritech.net,flash.net,nvbell.net,prodigy.net,wans.net,snet.net,yahoo.co.uk,ymail.co.uk,yahoo.ca,yahoo.com.au|google=gmail.com,googlemail.com|earthlink=earthlink.net,mindspring.com|cox=cox.net|optimum=optonline.net|centurylink=centurylink.net,embarqmail.com,q.com|windstream=windstream.net|frontier=frontier.com,frontiernet.net|juno=juno.com,netzero.net,netzero.com|shaw=shaw.ca|rogers=rogers.com|bell=sympatico.ca,bell.net|telus=telus.net|videotron=videotron.ca|sasktel=sasktel.net|bt=btinternet.com,btopenworld.com,talktalk.net|sky=sky.com|virginmedia=virginmedia.com,ntlworld.com,blueyonder.co.uk|telstra=bigpond.com,bigpond.net.au,telstra.com|optus=optusnet.com.au|iinet=iinet.net.au,westnet.com.au|spark=xtra.co.nz"
    client: false
  smtp_router_optimizer_esp_provider_map:
    default: "sparkpost=sparkpost1,mailgun=mailgun2,elastic=elastic,elasticemail=elastic,reachmail=reachmail_dedicated2"
    client: false
  smtp_router_optimizer_guard_min_sends:
    default: 2000
    min: 0
    max: 10000000
    client: false
  smtp_router_optimizer_max_complaint_percent:
    default: 0.1
    client: false
  smtp_router_optimizer_max_hard_bounce_percent:
    default: 2.0
    client: false
  smtp_router_optimizer_daily_caps:
    default: ""
    client: false
  smtp_router_optimizer_hourly_caps:
    default: ""
    client: false
  smtp_router_optimizer_strip_extra_headers:
    default: false
    client: false
  smtp_router_optimizer_debug_log:
    default: false
    client: false
